<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">U-Fund Tiers &amp; Layers Architecture</text>

  <!-- Presentation Tier -->
  <rect x="20" y="50" width="960" height="150" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="2"/>
  <text x="40" y="75" font-size="16" font-weight="bold" fill="#2c4870">Presentation Tier (Angular SPA)</text>

  <rect x="45" y="90" width="430" height="95" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="260" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4870">Components</text>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#333">Login, Cupboard, Proposals, ProposalDetail,</text>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#333">CreateProposal, AddNeed, OrganizationList,</text>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#333">CreateOrgComponent, FundingBasketComponent,</text>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#333">Checkout</text>

  <rect x="525" y="90" width="430" height="95" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="740" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4870">Services</text>
  <text x="740" y="132" text-anchor="middle" font-size="11" fill="#333">AccountService, NeedService, ProposalService,</text>
  <text x="740" y="150" text-anchor="middle" font-size="11" fill="#333">OrganizationService, FundingBasketService</text>
  <text x="740" y="170" text-anchor="middle" font-size="10" fill="#666">(wrap HttpClient calls to the backend)</text>

  <line x1="475" y1="137" x2="520" y2="137" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- arrow Presentation -> Application -->
  <line x1="500" y1="200" x2="500" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="222" font-size="11" fill="#333">HTTP (REST)</text>

  <!-- Application Tier -->
  <rect x="20" y="235" width="960" height="230" rx="8" fill="#e6f4ea" stroke="#3c8654" stroke-width="2"/>
  <text x="40" y="260" font-size="16" font-weight="bold" fill="#265c37">Application Tier (Spring Boot)</text>

  <rect x="45" y="275" width="430" height="175" rx="6" fill="#ffffff" stroke="#3c8654" stroke-width="1.5"/>
  <text x="260" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#265c37">API Layer</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333">NeedController</text>
  <text x="260" y="333" text-anchor="middle" font-size="11" fill="#333">ProposalController</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#333">OrganizationController</text>
  <text x="260" y="367" text-anchor="middle" font-size="11" fill="#333">AccountController</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#333">FundingBasketController</text>

  <rect x="525" y="275" width="430" height="175" rx="6" fill="#ffffff" stroke="#3c8654" stroke-width="1.5"/>
  <text x="740" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#265c37">Business Layer</text>
  <text x="740" y="316" text-anchor="middle" font-size="11" fill="#333">NeedServiceImpl</text>
  <text x="740" y="333" text-anchor="middle" font-size="11" fill="#333">ProposalServiceImpl</text>
  <text x="740" y="350" text-anchor="middle" font-size="11" fill="#333">OrganizationServiceImpl</text>
  <text x="740" y="367" text-anchor="middle" font-size="11" fill="#333">AccountServiceImpl</text>
  <text x="740" y="384" text-anchor="middle" font-size="11" fill="#333">FundingBasketImpl</text>

  <line x1="475" y1="362" x2="520" y2="362" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- arrow Application -> Data -->
  <line x1="500" y1="465" x2="500" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data Tier -->
  <rect x="20" y="500" width="960" height="240" rx="8" fill="#fdf3e3" stroke="#b8860b" stroke-width="2"/>
  <text x="40" y="525" font-size="16" font-weight="bold" fill="#7a5c00">Data Tier (Persistence)</text>

  <rect x="45" y="540" width="430" height="180" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
  <text x="260" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">Persistence Layer</text>
  <text x="260" y="581" text-anchor="middle" font-size="11" fill="#333">NeedFileDAO</text>
  <text x="260" y="598" text-anchor="middle" font-size="11" fill="#333">ProposalFileDAO</text>
  <text x="260" y="615" text-anchor="middle" font-size="11" fill="#333">OrganizationFileDAO</text>
  <text x="260" y="632" text-anchor="middle" font-size="11" fill="#333">AccountFileDAO</text>
  <text x="260" y="649" text-anchor="middle" font-size="11" fill="#333">FundingBasketFileDAO</text>

  <rect x="525" y="540" width="430" height="180" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
  <text x="740" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">Storage (JSON files)</text>
  <text x="740" y="583" text-anchor="middle" font-size="11" fill="#333">needs.json</text>
  <text x="740" y="600" text-anchor="middle" font-size="11" fill="#333">proposals.json</text>
  <text x="740" y="617" text-anchor="middle" font-size="11" fill="#333">organizations.json</text>
  <text x="740" y="634" text-anchor="middle" font-size="11" fill="#333">accounts.json</text>
  <text x="740" y="651" text-anchor="middle" font-size="11" fill="#333">fundingbaskets.json</text>

  <line x1="475" y1="627" x2="520" y2="627" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
