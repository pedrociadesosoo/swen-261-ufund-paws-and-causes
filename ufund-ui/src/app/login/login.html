<h2>Login page!</h2>
<div *ngIf="statusMsg">{{ statusMsg }}</div>
<form (ngSubmit)="login()" >
	<label for="username">username</label>
      <input
        id="username"
        type="text"
        name="username"
	[(ngModel)]="username"
        required
        maxlength="20"
        placeholder="Please enter username"
      />
      <small class="username-requirements">
        1-20 characters. Allowed: A-Z, a-z, 0-9, and _ (underscore).
      </small>
	<label for="password">password</label>
      <input
        id="password"
        type="password"
        name="password"
	[(ngModel)]="password"
        required
        placeholder="Please enter password"
      />
      <button type="submit">Log In</button>
      <button type="button" (click)="createAccount()">Create Account</button>
</form>
