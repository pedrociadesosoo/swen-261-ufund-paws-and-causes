<div class="add-need-container">
  <h2>Propose a New Need</h2>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="success">
    {{ successMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" #proposalForm="ngForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="proposal.name"
        name="name"
        required
        placeholder="Enter proposal name"
      />
    </div>

    <div class="form-group">
      <label for="cost">Cost</label>
      <input
        id="cost"
        type="number"
        [(ngModel)]="proposal.cost"
        name="cost"
        required
        min="0"
        placeholder="Enter cost"
      />
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input
        id="quantity"
        type="number"
        [(ngModel)]="proposal.quantity"
        name="quantity"
        required
        min="0"
        placeholder="Enter quantity"
      />
    </div>

    <div class="form-group">
      <label for="type">Type</label>
      <select name="type" [(ngModel)]="proposal.type">
        <option [ngValue]="NeedType.SELECT">Select Type</option>
        <option [ngValue]="NeedType.ITEM_DONATION">Item</option>
        <option [ngValue]="NeedType.MONETARY">Monetary</option>
        <option [ngValue]="NeedType.VOLUNTEERING">Volunteering</option>
      </select>
    </div>

    <div class="form-group">
      <label for="organization">Organization</label>
      <input
        id="organization"
        type="text"
        [(ngModel)]="proposal.organization"
        name="organization"
        placeholder="Enter organization (optional)"
      />
    </div>

    <div class="button-group">
      <button type="submit">Submit Proposal</button>
      <button type="button" (click)="goToCupboard()">Cancel</button>
    </div>
  </form>
</div>
