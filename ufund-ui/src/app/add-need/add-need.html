<div class="add-need-container">
  <h2>{{ isEditMode ? 'Edit Need' : 'Add Need to Cupboard' }}</h2>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="success">
    {{ successMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" #needForm="ngForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="need.name"
        name="name"
        required
        placeholder="Enter need name"
      />
    </div>

    <div class="form-group">
      <label for="cost">Cost</label>
      <input
        id="cost"
        type="number"
        [(ngModel)]="need.cost"
        name="cost"
        required
        min="0"
        placeholder="Enter cost"
      />
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input
        id="quantity"
        type="number"
        [(ngModel)]="need.quantity"
        name="quantity"
        required
        min="0"
        placeholder="Enter quantity"
      />
    </div>

    <div class="form-group">
      <label for="type">Need Type</label>
      <app-need-type-dropdown></app-need-type-dropdown>
    </div>

    <div class="button-group">
      <button type="submit">{{ isEditMode ? 'Save Changes' : 'Add Need' }}</button>
      <button type="button" (click)="goToCupboard()">Cancel</button>
    </div>
  </form>
</div>
